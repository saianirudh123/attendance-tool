<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · Krishna Engineering Attendance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css?v=9">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-panel">
      <div class="logo login-logo">
        <span class="logo-mark">KE</span>
        <div class="logo-text">
          <span class="logo-title">Krishna Engineering</span>
          <span class="logo-sub">Attendance Management System</span>
        </div>
      </div>
      <h1 class="login-title">Sign in to continue</h1>
      <p class="login-copy">Use your organization Google account to access the attendance register workflow.</p>
      <div class="login-actions">
        <a class="google-login-btn" href="/auth/login">Login with Google</a>
        <a class="google-signup-btn" href="/auth/signup">Sign up with Google</a>
      </div>
      <p class="login-note">New users are created as Makers. Admins can freeze approved registers.</p>
    </section>
  </main>
</body>
</html>
